# CI check: verify the site builds on every push / PR to main.
# Deployment itself is handled by Cloudflare Pages (connected to this repo),
# so this workflow only guards against broken builds reaching main.
name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
