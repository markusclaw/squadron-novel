site_name: SQUADRON
site_description: >-
  SQUADRON — a story development archive and novel reference system.
  Canon, world, characters, chronology, and manuscript for Book One.
# Update this to your Cloudflare Pages URL once the project is created.
site_url: https://squadron-novel.pages.dev/
copyright: SQUADRON — private author archive. Development build.

docs_dir: docs

theme:
  name: material
  language: en
  palette:
    scheme: slate            # dark, always
    primary: black
    accent: cyan
  font:
    text: Source Serif 4     # long-form reading
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra:
  status_legend: "● CANON   ◆ PROVISIONAL   ○ OPEN   × REJECTED"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/markusclaw/squadron-novel

